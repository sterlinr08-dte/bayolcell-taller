<!doctype html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<title>Flyer reparaciones iPhone (batería / cristal trasero)</title>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:800;src:url(../flyer-pantallas/fonts/barlow-condensed-800.woff2) format("woff2");}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(../flyer-pantallas/fonts/barlow-condensed-700.woff2) format("woff2");}
@font-face{font-family:"Inter";font-weight:100 900;src:url(../flyer-pantallas/fonts/inter-var.woff2) format("woff2");}

:root{
  --ink:#0A0A0C;
  --graphite:#141418;
  --line:rgba(255,255,255,.09);
  --red:#E31E24;
  --red-deep:#7A0B10;
  --bone:#F5F5F7;
  --mute:#9A9AA3;
  --wa:#25D366;
  /* feed defaults */
  --W:1080px; --H:1350px;
  --pad:60px;
  --top:48px;
  --logo-h:92px;
  --kicker:70px;
  --hero:168px;
  --row:41px;
  --row-name:28px;
  --row-price:32px;
  --gap-group:12px;
  --card-top:420px;
  --phone-w:290px;
  --phone-top:138px;
  --lg:18px;
}
body.story{
  --W:1080px; --H:1920px;
  --top:262px;
  --logo-h:96px;
  --kicker:76px;
  --hero:184px;
  --row:46px;
  --row-name:30px;
  --row-price:35px;
  --gap-group:16px;
  --card-top:662px;
  --phone-w:300px;
  --phone-top:354px;
  --lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink)}
body{width:var(--W);height:var(--H);overflow:hidden;font-family:"Inter",system-ui,sans-serif;color:var(--bone);
  -webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";}

.canvas{position:relative;width:var(--W);height:var(--H);overflow:hidden;
  background:
    radial-gradient(900px 700px at 86% 14%, rgba(227,30,36,.30), transparent 62%),
    radial-gradient(700px 500px at 0% 100%, rgba(227,30,36,.10), transparent 70%),
    linear-gradient(180deg,#0E0E11 0%, #08080A 100%);
}
body.story .canvas{
  background:
    radial-gradient(1000px 800px at 86% 26%, rgba(227,30,36,.30), transparent 62%),
    radial-gradient(800px 600px at 0% 92%, rgba(227,30,36,.12), transparent 70%),
    linear-gradient(180deg,#121215 0%, #08080A 55%, #0B0B0E 100%);
}
.grain{position:absolute;inset:0;background:url(../flyer-pantallas/grano.png);opacity:.06;mix-blend-mode:screen;pointer-events:none;z-index:50}

/* ---------- header ---------- */
.header{position:absolute;left:var(--pad);right:var(--pad);top:var(--top);display:flex;align-items:center;justify-content:space-between;z-index:5}
/* el logo.png trae mucho borde transparente: se recorta (x40 y198, 622×270, igual que la tarjeta de «Cotizar pantalla») */
.logo{--s:calc(var(--logo-h) / 270);height:var(--logo-h);width:calc(622 * var(--s));background:url(../../../assets/logo.png) no-repeat;background-size:calc(700 * var(--s)) calc(700 * var(--s));background-position:calc(-40 * var(--s)) calc(-198 * var(--s));filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.pill{display:flex;align-items:center;gap:14px;height:62px;padding:0 26px 0 20px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  font-weight:600;font-size:27px;letter-spacing:-.005em;color:var(--bone)}
.pill svg{width:30px;height:30px;flex:none}

/* ---------- headline ---------- */
.headline{position:absolute;left:var(--pad);top:calc(var(--top) + var(--logo-h) + 40px);z-index:4}
.kicker{font-family:"Barlow Condensed";font-weight:800;font-size:var(--kicker);line-height:.9;letter-spacing:.012em;text-transform:uppercase;color:var(--bone)}
.kicker em{font-style:normal;color:var(--red)}
.product{font-weight:700;font-size:var(--hero);line-height:.86;letter-spacing:-.055em;margin-left:-.04em;margin-top:6px;
  background:linear-gradient(180deg,#FFFFFF 30%,#C9C9CF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- phone (signature) ---------- */
.phone{position:absolute;right:calc(var(--pad) - 6px);top:var(--phone-top);width:var(--phone-w);z-index:2;
  filter:drop-shadow(0 0 60px rgba(227,30,36,.35)) drop-shadow(0 30px 50px rgba(0,0,0,.7))}
.phone svg{display:block;width:100%;height:auto}
.screen-copy{position:absolute;left:0;right:0;top:19%;text-align:center}
.screen-copy .desde{font-family:"Barlow Condensed";font-weight:700;font-size:38px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.88);padding-left:.22em}
.screen-copy .amt{font-family:"Barlow Condensed";font-weight:800;font-size:96px;line-height:.95;letter-spacing:-.005em;color:#fff;
  text-shadow:0 4px 24px rgba(80,0,0,.55)}
.screen-copy .amt small{font-size:.5em;font-weight:800;vertical-align:.62em;margin-right:4px;letter-spacing:.02em}


/* ---------- price card ---------- */
.card{position:absolute;left:calc(var(--pad) - 20px);right:calc(var(--pad) - 20px);top:var(--card-top);z-index:6;
  border-radius:38px;padding:22px 34px 20px;
  background:linear-gradient(180deg,rgba(28,28,33,.86) 0%,rgba(16,16,20,.94) 100%);
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 40px 80px rgba(0,0,0,.55);}
.card-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:999px;background:var(--red);color:#fff;
  font-family:"Barlow Condensed";font-weight:800;font-size:28px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 6px 18px rgba(227,30,36,.35)}
.card-head .sub{font-size:24px;font-weight:500;letter-spacing:-.005em;color:var(--mute)}
.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:56px;position:relative}
.cols::before{content:"";position:absolute;left:50%;top:6px;bottom:4px;width:1px;background:var(--line)}
.group{padding:calc(var(--gap-group) / 2) 0}
.group + .group{border-top:1px solid rgba(255,255,255,.06)}
.row{height:var(--row);display:flex;align-items:center;justify-content:space-between}
.name{font-size:var(--row-name);font-weight:500;letter-spacing:-.012em;color:#E9E9EE}
.name b{font-weight:700;color:#fff}
.price{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum";white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.price .cur{font-size:calc(var(--row-price) * .56);font-weight:600;color:var(--mute);letter-spacing:.02em}
.price .num{font-size:var(--row-price);font-weight:700;letter-spacing:-.02em;color:#fff;min-width:3.0em;text-align:right}

/* ---------- lower band ---------- */
.lower{position:absolute;left:calc(var(--pad) - 20px);right:calc(var(--pad) - 20px);z-index:6}
.band{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 30px 0 0;border-radius:18px;
  background:linear-gradient(90deg,rgba(227,30,36,.20),rgba(227,30,36,.05));border:1px solid rgba(227,30,36,.35);overflow:hidden}
.band .lbl{display:flex;align-items:center;gap:22px;font-size:29px;font-weight:600;letter-spacing:-.01em}
.band .lbl:first-child::before{content:"";width:8px;height:58px;background:var(--red)}
.band .lbl strong{font-weight:800}
.raffle{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:calc(var(--lg) + 2px);font-size:26px;font-weight:500;color:#D6D6DC}
.raffle svg{width:34px;height:34px;flex:none}

.branches{display:grid;grid-template-columns:repeat(3,1fr);margin-top:calc(var(--lg) + 4px);border-top:1px solid var(--line);padding-top:calc(var(--lg) + 4px)}
.branch{display:flex;align-items:center;gap:14px;padding:0 6px}
.branch + .branch{border-left:1px solid var(--line);padding-left:22px}
.branch svg{width:44px;height:44px;flex:none}
.branch .city{font-family:"Barlow Condensed";font-weight:700;font-size:23px;letter-spacing:.16em;color:var(--mute);line-height:1}
.branch .tel{font-size:29px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin-top:4px}

.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:var(--lg);gap:24px}
.handles{font-size:25px;line-height:1.2;font-weight:600;color:var(--bone);white-space:nowrap}
.handles span{color:var(--red);margin:0 10px}
.fine{font-size:17px;line-height:1.4;color:#83838C;text-align:right;white-space:nowrap}
</style>
</head>
<body>
<div class="canvas">
  <div class="grain"></div>

  <header class="header">
    <div class="logo" role="img" aria-label="Bayolcell Cellphone Store"></div>
    <div class="pill">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="17" r="12" stroke="#E31E24" stroke-width="2.6"/>
        <path d="M16 10.5V17l4.2 2.6" stroke="#F5F5F7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12.5 2.8h7" stroke="#E31E24" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span id="pillTxt"></span>
    </div>
  </header>

  <section class="headline">
    <div class="kicker" id="kicker"></div>
    <div class="product">iPhone</div>
  </section>

  <!-- Signature: a correct front-view iPhone (single Dynamic Island) whose fresh screen carries the hero price -->
  <div class="phone">
    <svg viewBox="0 0 340 700" aria-hidden="true">
      <defs>
        <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5A5A62"/>
          <stop offset=".35" stop-color="#2A2A30"/>
          <stop offset=".7" stop-color="#3C3C44"/>
          <stop offset="1" stop-color="#1A1A1E"/>
        </linearGradient>
        <radialGradient id="glow" cx=".5" cy=".36" r=".85">
          <stop offset="0" stop-color="#FF4A4F"/>
          <stop offset=".28" stop-color="#E31E24"/>
          <stop offset=".62" stop-color="#6E0A0E"/>
          <stop offset="1" stop-color="#160406"/>
        </radialGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
          <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- side buttons -->
      <rect x="0" y="128" width="6" height="34" rx="2" fill="#2E2E34"/>
      <rect x="0" y="186" width="6" height="58" rx="2" fill="#2E2E34"/>
      <rect x="0" y="258" width="6" height="58" rx="2" fill="#2E2E34"/>
      <rect x="334" y="206" width="6" height="92" rx="2" fill="#2E2E34"/>
      <!-- body -->
      <rect x="4" y="2" width="332" height="696" rx="58" fill="url(#frame)"/>
      <rect x="9" y="7" width="322" height="686" rx="53" fill="#050506"/>
      <!-- screen -->
      <rect x="19" y="17" width="302" height="666" rx="44" fill="url(#glow)"/>
      <rect x="19" y="17" width="302" height="666" rx="44" fill="url(#sheen)"/>
      <!-- Dynamic Island (frente) -->
      <rect class="frente" x="122" y="33" width="96" height="28" rx="14" fill="#000"/>
      <!-- Cámaras (dorso, para el cristal trasero) -->
      <g class="dorso" style="display:none" transform="translate(12 12) scale(.62)">
        <rect x="30" y="30" width="134" height="138" rx="34" fill="rgba(20,4,6,.55)" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
        <circle cx="68" cy="68" r="25" fill="#0B0B0D" stroke="#3A3A40" stroke-width="5"/><circle cx="68" cy="68" r="10" fill="#1C2333"/>
        <circle cx="68" cy="130" r="25" fill="#0B0B0D" stroke="#3A3A40" stroke-width="5"/><circle cx="68" cy="130" r="10" fill="#1C2333"/>
        <circle cx="128" cy="99" r="25" fill="#0B0B0D" stroke="#3A3A40" stroke-width="5"/><circle cx="128" cy="99" r="10" fill="#1C2333"/>
        <circle cx="140" cy="48" r="8" fill="#F3E3C0" opacity=".85"/>
      </g>
    </svg>
    <div class="screen-copy">
      <div class="desde">Desde</div>
      <div class="amt" id="desdeAmt"></div>
    </div>
  </div>

  <section class="card" id="card">
    <div class="card-head"><span class="sub">Modelo de iPhone</span><span class="sub" id="subPrecio"></span></div>
    <div class="cols" id="cols"></div>
  </section>

  <section class="lower" id="lower">
    <div class="band">
      <div class="lbl" id="bandTxt"></div>
      <div class="lbl" id="bandDer" style="gap:0;font-weight:700"></div>
    </div>
    <div class="raffle">
      <svg viewBox="0 0 34 34" fill="none" aria-hidden="true">
        <path d="M4 10a2 2 0 0 1 2-2h22a2 2 0 0 1 2 2v3.2a3.8 3.8 0 0 0 0 7.6V24a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3.2a3.8 3.8 0 0 0 0-7.6V10z" stroke="#E31E24" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M21 9.5v15" stroke="#E31E24" stroke-width="2" stroke-dasharray="2.4 2.6"/>
      </svg>
      Cada reparación te da un boleto para la rifa
    </div>
    <div class="branches" id="branches"></div>
    <div class="foot">
      <div class="handles">@bayolcell<span>·</span>bayolcell.com</div>
      <div class="fine">Precios en pesos dominicanos, sujetos a cambio sin previo aviso.<br>Rifa: ver bases en tienda.</div>
    </div>
  </section>
</div>

<script>
const v = new URLSearchParams(location.search).get('v') || 'feed';
document.body.className = v;

// Precios de cliente (Info Plus, nivel 1) — 13-oct-2026. Solo nivel 1; nunca costos.
const tipo = new URLSearchParams(location.search).get('tipo') || 'bateria';
const DATOS = {
  bateria: {
    pill:'Lista en 30 minutos', kicker:'Cambio de <em>batería</em>', desde:1000, filas:36, sub:'Precio por batería',
    band:'<span>Baterías <strong>certificadas</strong></span>', bandDer:'Garantía incluida',
    left: [
      [["6s / 7 / 8",1000],["7 Plus",1000],["8 Plus",1100]],
      [["X",1200],["XS",1350],["XR",1300],["XS Max",1500]],
      [["11",800],["11 Pro",1500],["11 Pro Max",2000]],
      [["12 / 12 Pro",1900],["12 Pro Max",2500]],
    ],
    right: [
      [["13",2300],["13 Pro",2800],["13 Pro Max",3000]],
      [["14",3000],["14 Plus",3000],["14 Pro",3500],["14 Pro Max",4000]],
      [["15",3500],["15 Plus",4000],["15 Pro",4000],["15 Pro Max",5000]],
    ],
  },
  trasero: {
    pill:'Lista en 50 minutos', kicker:'Cristal <em>trasero</em>', desde:1200, sub:'Precio por cristal', dorso:true,
    band:'<span>Recupera el look de tu iPhone</span>', bandDer:'Garantía incluida',
    left: [
      [["8 / 8 Plus",1200]],
      [["X / XS",1500],["XR",1500],["XS Max",1500]],
      [["11",1850],["11 Pro",1850],["11 Pro Max",1850]],
      [["12",2100],["12 Pro / 12 Pro Max",2500]],
    ],
    right: [
      [["13",2000],["13 Pro",2500],["13 Pro Max",2850]],
      [["14 / 14 Plus",3000],["14 Pro / 14 Pro Max",3000]],
      [["15 Plus",3500],["15 Pro Max",4000]],
      [["16 / 16 Plus",3000],["16 Pro Max",5000],["17 Pro Max",5000]],
    ],
  },
}[tipo];
const left = DATOS.left, right = DATOS.right;
if (DATOS.filas) document.body.style.setProperty('--row', DATOS.filas + 'px');
document.getElementById('pillTxt').textContent = DATOS.pill;
document.getElementById('kicker').innerHTML = DATOS.kicker;
document.getElementById('subPrecio').textContent = DATOS.sub;
document.getElementById('bandTxt').innerHTML = DATOS.band;
document.getElementById('bandDer').textContent = DATOS.bandDer;
document.getElementById('desdeAmt').innerHTML = '<small>RD$</small>' + DATOS.desde.toLocaleString('en-US');
if (DATOS.dorso){ document.querySelector('.frente').style.display='none'; document.querySelector('.dorso').style.display=''; document.querySelector('.screen-copy').style.top='21%'; }
const fmt = n => n.toLocaleString('en-US');
// Bold the generation token (number or X/XS/XR) so the eye finds its phone first.
const nm = s => s.replace(/(^|\/ )(\d+s?|XS|XR|X)/g, '$1<b>$2</b>');
const col = groups => '<div>' + groups.map(g => '<div class="group">' + g.map(([n,p]) =>
  `<div class="row"><span class="name">${nm(n)}</span><span class="price"><span class="cur">RD$</span><span class="num">${fmt(p)}</span></span></div>`).join('') + '</div>').join('') + '</div>';
document.getElementById('cols').innerHTML = col(left) + col(right);

const wa = `<svg viewBox="0 0 44 44" aria-hidden="true"><path d="M22 3C11.5 3 3 11.3 3 21.6c0 3.6 1 6.9 2.8 9.8L3.4 40.6l9.6-2.5c2.7 1.4 5.8 2.2 9 2.2 10.5 0 19-8.3 19-18.6S32.5 3 22 3z" fill="#25D366"/><path d="M15.9 12.6c.5 0 1 .3 1.2.8l1.7 4c.2.5.1 1-.2 1.4l-1.5 1.8c1.3 2.6 3.4 4.7 6 6l1.8-1.5c.4-.3.9-.4 1.4-.2l4 1.7c.5.2.8.7.8 1.2v2.6c0 1-.8 1.8-1.8 1.8C20.4 32.2 11.8 23.6 11.8 13.7v-.3c0-.4.4-.8.8-.8h3.3z" fill="#fff"/></svg>`;
const br = [["SANTIAGO","809-707-2493"],["MOCA","829-670-9694"],["NAVARRETE","809-893-4412"]];
document.getElementById('branches').innerHTML = br.map(([c,t]) =>
  `<div class="branch">${wa}<div><div class="city">${c}</div><div class="tel">${t}</div></div></div>`).join('');

// Place the lower block right under the card.
requestAnimationFrame(() => {
  const card = document.getElementById('card');
  const gap = v === 'story' ? 22 : 18;
  document.getElementById('lower').style.top = (card.offsetTop + card.offsetHeight + gap) + 'px';
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
