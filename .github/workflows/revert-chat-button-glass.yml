name: Revert chat button glass

on:
  push:
    branches:
      - chatgpt/crm-chat-flat-buttons-20260903
    paths:
      - '.github/workflows/revert-chat-button-glass.yml'
      - 'scripts/append-flat-chat-buttons.py'

permissions:
  contents: write

jobs:
  patch-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/crm-chat-flat-buttons-20260903

      - name: Restore flat chat buttons
        run: python3 scripts/append-flat-chat-buttons.py

      - name: Commit CSS patch
        shell: bash
        run: |
          if git diff --quiet -- crm-glass-mobile.css; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "bayolcell-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crm-glass-mobile.css
          git commit -m "CRM chat: revierte glass de botones"
          git push origin HEAD:chatgpt/crm-chat-flat-buttons-20260903
