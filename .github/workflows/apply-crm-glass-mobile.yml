name: Apply CRM glass mobile styles

on:
  push:
    branches:
      - chatgpt/crm-glass-mobile-20260903
    paths:
      - '.github/workflows/apply-crm-glass-mobile.yml'
      - 'scripts/inject-crm-glass-mobile.py'
      - 'crm-glass-mobile.css'

permissions:
  contents: write

jobs:
  inject-stylesheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/crm-glass-mobile-20260903

      - name: Link CRM glass stylesheet
        run: python3 scripts/inject-crm-glass-mobile.py

      - name: Commit generated HTML link
        shell: bash
        run: |
          if git diff --quiet -- taller.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "bayolcell-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add taller.html
          git commit -m "Aplica estilos glass al CRM móvil"
          git push origin HEAD:chatgpt/crm-glass-mobile-20260903
